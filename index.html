<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Ukeshandel</title>
<meta name="theme-color" content="#2f7a4c">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>\n*{{box-sizing:border-box}}\nhtml,body{{margin:0}}\n[hidden]{{display:none!important}}\n:root{{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}}
/* Layout: one narrow column like a phone note; sticky tab bar; dinner section on top, rest below */
:root{
  --bg:#f6f7f3; --card:#ffffff; --ink:#1d2621; --muted:#66716a; --line:#e2e6df;
  --accent:#2f7a4c; --accent-soft:#e3f0e7; --done:#a3aba5;
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131815; --card:#1b221e; --ink:#e7ece8; --muted:#97a39b; --line:#2b352f;
  --accent:#6cc28f; --accent-soft:#1f3328; --done:#5d6861; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131815; --card:#1b221e; --ink:#e7ece8; --muted:#97a39b; --line:#2b352f;
  --accent:#6cc28f; --accent-soft:#1f3328; --done:#5d6861; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 80px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.9rem;margin:6px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.95rem;margin:0 0 12px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding-block:8px;border-bottom:1px solid var(--line)}
nav button{flex:1;font:700 .95rem var(--f-body);padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:22px 0 8px;text-wrap:balance}
.group{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ghead b{color:var(--accent);font-size:.95rem;letter-spacing:0;text-transform:none;font-family:var(--f-display)}
.groups{display:flex;flex-direction:column;gap:10px}
ul{list-style:none;margin:0;padding:0}
li.item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.ghead+ul li.item:first-child{border-top:0}
li.item input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
li.item span{min-width:0;overflow-wrap:anywhere}
li.item.on span{color:var(--done);text-decoration:line-through}
.rest li.item:first-child{border-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{font:700 .95rem var(--f-body);padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn.small{padding:6px 10px;font-size:.85rem}
.btn:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],input[type=search],select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0;flex:1}
label.tog{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.95rem}
.day{display:grid;grid-template-columns:5.5em 1fr;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day b{font-family:var(--f-display);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:4px 6px 4px 12px;font-size:.92rem}
.chip button{border:0;background:transparent;color:var(--muted);font-size:1.1rem;line-height:1;cursor:pointer;padding:2px 6px}
.dish .ghead{align-items:center}
.addline{display:flex;gap:8px;padding:0 14px 14px}
.empty{color:var(--muted);padding:12px 14px}
.status{color:var(--muted);font-size:.8rem;margin-top:24px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.95rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:.95rem}
li.item.edit{gap:10px}
li.item.edit .grip{color:var(--muted);font-size:.9rem;letter-spacing:-2px;flex:none}
li.item.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:10px;padding-top:12px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel .ptitle{font-family:var(--f-display);font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
.panel select{flex:1 1 160px}
.panel input[type=search]{flex:1 1 160px;min-width:0;font-size:16px}
.mvlist{max-height:32vh}
.addbox{display:flex;flex-direction:column;gap:8px}
.addbox select{flex:none;width:100%}
.addbox input[type=search]{flex:none}
.reslist{background:var(--card);border:1px solid var(--line);border-radius:12px;max-height:50vh;overflow-y:auto}
li.res{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
li.res:first-child{border-top:0}
li.res span{min-width:0;overflow-wrap:anywhere}
li.res .state{margin-left:auto;flex:none;color:var(--accent);font-weight:700;font-size:.85rem}
li.res.active{background:var(--accent-soft)}
li.res.active .state{color:var(--muted);font-weight:400}
.picker{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.picker[hidden]{display:none!important}
.daybtn{text-align:left;width:100%;font-weight:400}
.daybtn.none{color:var(--muted)}
.cnt{margin-left:auto;color:var(--muted);font-size:.8rem;flex:none}
.panel input[type=text]{flex:1 1 160px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.phead input{flex:1;min-width:0;padding:8px 12px;font-size:16px}
.pkbody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:12px;-webkit-overflow-scrolling:touch}
.pklist{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pklist:empty{display:none}
input[type=search]{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.pklist li.item:first-child{border-top:0}
li.item.picked{background:var(--accent-soft)}
.pknew{background:var(--card);border:1px dashed var(--accent);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pknew select{flex:1 1 160px}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.gate[hidden]{display:none!important}
.gate img{width:96px;height:96px;border-radius:22px}
.gate h1{margin:0}
.gate p{max-width:32ch;color:var(--muted);margin:0}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:.8rem;cursor:pointer;padding:4px}
li.item .nm{flex:1;display:flex;flex-direction:column}
li.item .by{color:var(--muted);font-size:.78rem}
.step{display:flex;align-items:center;gap:4px;flex:none;margin-left:auto}
.qb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 1.1rem var(--f-body);cursor:pointer;line-height:1;padding:0}
.qb:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.qv{min-width:1.6em;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:400}
.qv.many{color:var(--accent);font-weight:700}
.cq{color:var(--accent);font-weight:700}
li.item .note{color:var(--accent);font-size:.8rem}
li.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 6px;border-top:1px solid var(--line);background:var(--bg)}
.rest li.sec:first-child{border-top:0}
.secbtn{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;color:var(--ink);font:600 1rem var(--f-display);cursor:pointer;text-align:left}
.secbtn .chev{color:var(--muted);width:1em;display:inline-block}
li.sec small{color:var(--muted);font-size:.8rem;flex:none}
li.sec small.left{color:var(--accent);font-weight:700}
li.item.hdr{background:var(--bg)}
.pkh{padding:12px 14px 4px;font:600 .85rem var(--f-display);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-top:1px solid var(--line)}
.pklist .pkh:first-child{border-top:0}
.shopbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:4;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);padding-block:12px;color:var(--muted)}
.shopbar .big{font-family:var(--f-display);font-size:1.6rem;color:var(--ink)}
.shsec{font:600 .85rem var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 6px}
ul.shop{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li.sh{display:flex;align-items:center;gap:14px;padding:15px 16px;border-top:1px solid var(--line);cursor:pointer;user-select:none;font-size:1.12rem}
li.sh:first-child{border-top:0}
li.sh .box{width:26px;height:26px;border-radius:7px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:.9rem;color:var(--bg)}
li.sh .box.on{background:var(--accent);border-color:var(--accent)}
li.sh .nm{flex:1;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
li.sh .shq{color:var(--accent);font-family:var(--f-display);font-size:1.2rem;flex:none}
li.sh.done .nm{color:var(--done);text-decoration:line-through}
.basket{margin-top:20px}
.basket summary{cursor:pointer;color:var(--muted);font-weight:700;padding:8px 0}
body.editing .wrap{padding-bottom:440px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

/* ===== Hjelpere og datamodell (v3) =====
   items:   {id: {n, c, q, x, o, note?, h?}}  h = avdelingsoverskrift, o = rekkefølge
   dinners: {id: {name, ing:[itemId], qty:{itemId:n}, o}}
   week:    {Mandag: dinnerId}
   Lagres med feltvise oppdateringer, så to personer kan endre samtidig. */
function key(s){return String(s).trim().toLowerCase()}
function clone(x){return JSON.parse(JSON.stringify(x))}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function splitQ(s){const m=String(s).match(/^(.*?)\s+x\s*(\d+)?\s*$/i);return m&&m[1].trim()?{n:m[1].trim(),q:m[2]?Math.max(1,+m[2]):1}:{n:String(s).trim(),q:1}}
function migrateV2(st){
  if(st.v>=2)return st;
  const out=[],idx={};
  for(const it of st.items||[]){const s=splitQ(it.n),k=key(s.n);
    if(k in idx){const o=out[idx[k]];o.q=Math.max(o.q,s.q);o.c=o.c&&it.c}
    else{idx[k]=out.length;out.push({n:s.n,c:!!it.c,q:s.q})}}
  st.items=out;
  for(const d of st.dinners||[]){const seen=new Set(),ing=[];for(const i of d.ing){const s=splitQ(i),k=key(s.n);if(!seen.has(k)){seen.add(k);ing.push(s.n)}}d.ing=ing;d.qty={}}
  st.v=2;return st;
}
const HDR={"pinjekjerner":"Frukt og grønt","hvit monster":"Drikke","focaccia":"Brød","aiolo":"Kjøl","kjøttdeig":"Kjøtt og pålegg","fetaost":"Ost","pepper":"Krydder og sauser","makrell i tomat":"Hermetikk og baking","ovnsbakte grønnsaker":"Frys","tomatpure":"Tørrvarer","creme fraiche":"Meieri","tacolefse":"Taco","pesto":"Middag og pasta","nachos":"Snacks og godteri","cleanex":"Husholdning","tannbørste hode":"Hygiene og apotek"};
function toV3(src){
  const d=clone(src);
  if(d.v>=3)return d;
  migrateV2(d);
  const items={},idBy={};let o=0;
  for(const it of d.items||[]){
    const k=key(it.n);
    if(HDR[k])items[uid("h")]={n:HDR[k],h:true,o:o+=1000};
    if(idBy[k])continue;
    const id=uid("i");idBy[k]=id;
    items[id]={n:it.n,c:!!it.c,q:it.q||1,x:it.x||0,o:o+=1000};
  }
  const dinners={},dmap={};let i=0;
  for(const dn of d.dinners||[]){
    const ing=[],qty={};
    for(const nm of dn.ing||[]){
      let id=idBy[key(nm)];
      if(!id){id=uid("i");idBy[key(nm)]=id;items[id]={n:nm,c:true,q:1,x:0,o:o+=1000}}
      if(!ing.includes(id))ing.push(id);
      const qv=dn.qty&&dn.qty[key(nm)];if(qv>1)qty[id]=qv;
    }
    const nid=uid("d");dmap[dn.id]=nid;
    dinners[nid]={name:dn.name,ing,qty,o:i++};
  }
  const week={};for(const day of DAYS)week[day]=dmap[(d.week||{})[day]]||"";
  return {v:3,items,dinners,week};
}

/* ---- rekkefølge ---- */
function renorm(){ids().forEach((id,i)=>S.items[id].o=(i+1)*1000)}
function placeAt(id,pos){
  const arr=ids().filter(x=>x!==id),last=arr.length?I(arr[arr.length-1]).o:0;
  if(pos&&pos.sec){const hi=arr.indexOf(pos.sec);if(hi<0)pos="end";else{let j=hi;while(j+1<arr.length&&!I(arr[j+1]).h)j++;pos={after:arr[j]}}}
  if(pos==="top"){I(id).o=(arr.length?I(arr[0]).o:0)-1000;return}
  if(!pos||pos==="end"||!pos.after){I(id).o=last+1000;return}
  const i=arr.indexOf(pos.after);if(i<0){I(id).o=last+1000;return}
  const a=I(arr[i]).o,b=i+1<arr.length?I(arr[i+1]).o:a+2000;
  if(b-a<1e-6){renorm();return placeAt(id,pos)}
  I(id).o=(a+b)/2;
}
function parsePos(v){if(v==="top"||v==="end")return v;if(v&&v.startsWith("s:"))return {sec:v.slice(2)};return "end"}

}

function planned(){const p={},by={};for(const d of DAYS){const din=S.dinners[S.week[d]];if(din)for(const id of din.ing||[]){if(!S.items[id])continue;p[id]=(p[id]||0)+((din.qty&&din.qty[id])||1);(by[id]=by[id]||[]).push(din.name)}}return {p,by}}

function qtyOf(id){const it=I(id);return PL.p[id]?Math.max(1,PL.p[id]+(it.x||0)):(it.q||1)}
function bump(id,d){const it=I(id),pp=planned().p[id];
  if(pp){const nx=(it.x||0)+d;if(pp+nx<1)return;it.x=nx}else{const nq=(it.q||1)+d;if(nq<1)return;it.q=nq}
  changed()}

function changed(noRender){clearTimeout(saveTimer);saveTimer=setTimeout(save,400);if(!noRender)render()}
function diffArgs(){
  const FP=firebase.firestore.FieldPath,DEL=firebase.firestore.FieldValue.delete(),a=[];
  const eq=(x,y)=>JSON.stringify(x)===JSON.stringify(y);
  for(const top of ["items","dinners"]){const s=S[top]||{},b=B[top]||{};
    for(const id of new Set([...Object.keys(s),...Object.keys(b)])){
      if(!(id in s)){a.push(new FP(top,id),DEL);continue}
      if(!(id in b)){a.push(new FP(top,id),clone(s[id]));continue}
      for(const f of new Set([...Object.keys(s[id]),...Object.keys(b[id])])){
        if(eq(s[id][f],b[id][f]))continue;
        a.push(new FP(top,id,f),s[id][f]===undefined?DEL:clone(s[id][f]));
      }}}
  for(const d of DAYS)if((S.week[d]||"")!==((B.week||{})[d]||""))a.push(new FP("week",d),S.week[d]||"");
  return a;
}
function save(){
  saveTimer=null;if(!ref||!B)return;
  const a=diffArgs();if(!a.length)return;
  B=clone(S);
  ref.update(...a).then(()=>status("Lagret")).catch(e=>status(e&&e.code==="permission-denied"?"Du har ikke tilgang til å endre listen":"Kunne ikke lagre ("+(e&&e.code||"ukjent feil")+")"));
}

    const rows=g.items.filter(id=>!I(id).c);if(!rows.length)continue;
    if(g.h)h+=`<div class="shsec">${esc(I(g.h).n)}</div>`;
    h+=`<ul class="shop">${rows.map(id=>{const q=qtyOf(id);return `<li class="sh" data-sh="${id}"><span class="box" aria-hidden="true"></span><span class="nm">${esc(I(id).n)}${subLine(id)}</span>${q>1?`<b class="shq">×${q}</b>`:""}</li>`}).join("")}</ul>`;
  }
  if(!left.length)h+=`<p class="empty" style="text-align:center">Alt er i kurven.</p>`;
  const inb=trip.filter(id=>S.items[id]&&I(id).c);
  if(inb.length)h+=`<details class="basket"${ls("bopen",false)?" open":""}><summary>I kurven (${inb.length})</summary><ul class="shop">${inb.map(id=>`<li class="sh done" data-unsh="${id}"><span class="box on" aria-hidden="true">✓</span><span class="nm">${esc(I(id).n)}</span>${qtyOf(id)>1?`<b class="shq">×${qtyOf(id)}</b>`:""}</li>`).join("")}</ul></details>`;
  return h;
}

/* ---- ukeplan ---- */
function renderUke(){
  let h=`<h2>Hva skal dere spise?</h2><div class="group">`;
  for(const d of DAYS){const din=S.dinners[S.week[d]];h+=`<div class="day"><b>${d}</b><button class="btn daybtn${din?"":" none"}" data-dayp="${d}">${din?esc(din.name):"Velg middag"}</button></div>`}
  h+=`</div><p class="sub" style="margin-top:10px">Når du velger en middag, blir ingrediensene uavhuket i handlelisten. Rekkefølgen i listen endres ikke.</p>`;
  h+=`<div class="toolbar"><button class="btn primary" id="newweek">Ny uke: huk av alt annet</button></div>`;
  if(confirmReset)h+=`<div class="confirm">Alt som ikke hører til ukens middager blir avhuket. <button class="btn small primary" id="yesreset">Ja, gjør det</button><button class="btn small" id="noreset">Avbryt</button></div>`;
  return h;
}
/* ---- middager ---- */
function renderMiddager(){
  let h=`<div class="toolbar"><input type="text" id="newdin" placeholder="Ny middag, f.eks. Lasagne"><button class="btn primary" id="adddin">Lag middag</button></div><h2>Dine middager</h2><div class="groups">`;
  for(const did of dinnerIds()){const d=S.dinners[did];
    const chips=(d.ing||[]).filter(id=>S.items[id]).map(id=>`<span class="chip">${esc(I(id).n)}${dq(d,id)>1?` <b class="cq">×${dq(d,id)}</b>`:""}<button data-din="${did}" data-dii="${id}" aria-label="Fjern ${esc(I(id).n)}">×</button></span>`).join("");
    h+=`<div class="group dish"><div class="ghead"><b>${esc(d.name)}</b><button class="btn small" data-deldin="${did}">${delArm===did?"Trykk igjen":"Slett"}</button></div>
    <div class="chips">${chips||'<span class="sub">Ingen ingredienser ennå</span>'}</div>
    <div class="addline"><button class="btn small primary" data-pick="${did}">Velg ingredienser fra listen</button></div></div>`;
  }
  return h+`</div>`;
}

/* ---- velgere ---- */
function pickListHtml(){
  const d=S.dinners[pickerDin];if(!d)return"";
  const q=key(pickerQ),inDin=new Set(d.ing||[]);let h="";
  for(const id of ids()){const it=I(id);
    if(it.h){if(!q)h+=`<li class="pkh">${esc(it.n)}</li>`;continue}
    if(q&&!key(it.n).includes(q))continue;
    const on=inDin.has(id);
    h+=`<li class="item${on?" picked":""}" data-pk="${id}"><input type="checkbox" tabindex="-1" ${on?"checked":""} aria-label="${esc(it.n)}"><span class="nm">${esc(it.n)}</span>${on?`<span class="step"><button class="qb" data-dq="-1" data-dk="${id}" aria-label="Færre">−</button><b class="qv${dq(d,id)>1?" many":""}">${dq(d,id)}</b><button class="qb" data-dq="1" data-dk="${id}" aria-label="Flere">+</button></span>`:""}</li>`;
  }
  if(q&&!h)h=`<li class="empty">Ingen varer i listen matcher «${esc(pickerQ)}»</li>`;
  return h;
}
function pickNewHtml(){const s=splitQ(pickerQ.trim());if(!s.n||findByName(s.n))return"";
  return `<div class="pknew"><div>Ny vare: <b>${esc(s.n)}</b></div><div class="row"><select id="pk-pos" aria-label="Plassering i listen">${posOptions(lastPos)}</select><button class="btn small primary" id="pk-add">Legg til i listen og middagen</button></div></div>`}
function dayListHtml(){
  const q=key(dayQ),cur=S.week[dayPick]||"";
  const rows=dinnerIds().filter(id=>!q||key(S.dinners[id].name).includes(q));
  let h=q?"":`<li class="item${cur===""?" picked":""}" data-did=""><span>Ingen middag</span></li>`;
  h+=rows.map(id=>`<li class="item${id===cur?" picked":""}" data-did="${id}"><span>${esc(S.dinners[id].name)}</span><small class="cnt">${(S.dinners[id].ing||[]).length} ingredienser</small></li>`).join("");
  if(q&&!rows.length)h+=`<li class="empty">Ingen middag heter «${esc(dayQ)}»</li>`;
  return h;
}
function dayNewHtml(){const q=dayQ.trim();if(!q||dinnerIds().some(id=>key(S.dinners[id].name)===key(q)))return"";
  return `<div class="pknew"><div>Ny middag: <b>${esc(q)}</b></div><button class="btn small primary" id="dp-add">Lag middagen og velg ingredienser</button></div>`}
function newDinner(name){const id=uid("d");S.dinners[id]={name,ing:[],qty:{},o:Date.now()};return id}
function setDay(id){S.week[dayPick]=id;applyWeek();changed(true);const din=S.dinners[id];if(din)toast(din.name+": ingredienser uavhuket")}
function renderPicker(){
  const el=$("#picker");
  if(dayPick){el.hidden=false;document.body.style.overflow="hidden";
    el.innerHTML=`<div class="phead"><input type="search" id="dp-q" placeholder="Middag til ${esc(dayPick.toLowerCase())}: søk" value="${esc(dayQ)}" autocomplete="off"><button class="btn small" id="dp-done">Lukk</button></div>
      <div class="pkbody"><ul id="dp-list" class="pklist">${dayListHtml()}</ul><div id="dp-new">${dayNewHtml()}</div></div>`;return}
  const d=S.dinners[pickerDin];
  if(!d){el.hidden=true;document.body.style.overflow="";return}
  el.hidden=false;document.body.style.overflow="hidden";
  el.innerHTML=`<div class="phead"><input type="search" id="pk-q" placeholder="Ingredienser til ${esc(d.name)}: søk" value="${esc(pickerQ)}" autocomplete="off"><button class="btn small primary" id="pk-done">Ferdig</button></div>
    <div class="pkbody"><ul id="pk-list" class="pklist">${pickListHtml()}</ul><div id="pk-new">${pickNewHtml()}</div></div>`;
}
function refreshPick(){if(dayPick){$("#dp-list").innerHTML=dayListHtml();$("#dp-new").innerHTML=dayNewHtml()}else if(pickerDin&&$("#pk-list")){const l=$("#pk-list"),st=l.parentNode.scrollTop;l.innerHTML=pickListHtml();$("#pk-new").innerHTML=pickNewHtml();l.parentNode.scrollTop=st}}
function closePicker(){pickerDin=null;pickerQ="";dayPick=null;dayQ="";renderPicker();render()}

function render(){
  PL=planned();
  if(selId&&!S.items[selId])selId=null;
  const ae=document.activeElement,aid=ae&&$("#view").contains(ae)&&ae.id,ss=aid&&ae.selectionStart;
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  document.body.classList.toggle("editing",!!(editMode&&selId));
  document.body.classList.toggle("shopping",tab==="liste"&&shop&&!editMode);
  $("#view").innerHTML=tab==="uke"?renderUke():tab==="middager"?renderMiddager():renderListe();
  $("#sub").textContent=itemIds().filter(id=>!I(id).c).length+" varer igjen å handle";
  if(aid){const n=document.getElementById(aid);if(n){n.focus();try{if(ss!=null)n.setSelectionRange(ss,ss)}catch(e){}}}
}
function scrollSel(){const el=document.querySelector(`li.item[data-id="${selId}"]`);if(el)el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
function moved(){mvQ="";changed();scrollSel();toast("Flyttet")}

/* ---- hendelser ---- */
document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;confirmReset=false;editMode=false;selId=null;delArm=false;lsSet("tab",tab);render()});
$("#view").addEventListener("click",e=>{
  const t=e.target;
  const qb=t.closest("button.qb");if(qb&&qb.dataset.qi){bump(qb.dataset.qi,+qb.dataset.qd);return}
  const sb=t.closest("button.secbtn");if(sb){const id=sb.dataset.col;col=col.includes(id)?col.filter(x=>x!==id):[...col,id];lsSet("col",col);render();return}
  const sh=t.closest("li[data-sh]");if(sh){const id=sh.dataset.sh;I(id).c=true;if(!trip.includes(id))trip.push(id);lsSet("trip",trip);changed();return}
  const us=t.closest("li[data-unsh]");if(us){const id=us.dataset.unsh;I(id).c=false;trip=trip.filter(x=>x!==id);lsSet("trip",trip);changed();return}
  const mv=t.closest("li.mvr");if(mv){placeAt(selId,{after:mv.dataset.mk});moved();return}
  const rs=t.closest("li.res");if(rs){if(S.items[rs.dataset.ak])pickExisting(rs.dataset.ak);return}
  const li=t.closest("li.item");
  if(li&&li.dataset.id){const id=li.dataset.id;
    if(editMode){selId=selId===id?null:id;delArm=false;mvQ="";render();return}
    I(id).c=!I(id).c;changed();return}
  if(t.id==="shopmode"){shop=true;lsSet("shop",true);render();window.scrollTo(0,0);return}
  if(t.id==="shopdone"){shop=false;trip=[];lsSet("shop",false);lsSet("trip",[]);render();toast("Handlet ferdig");return}
  if(t.id==="editmode"){editMode=!editMode;selId=null;delArm=false;mvQ="";render();return}
  if(t.id==="newsec"){const id=uid("h");S.items[id]={n:"Ny avdeling",h:true,o:0};placeAt(id,"end");selId=id;changed();setTimeout(()=>{scrollSel();const n=$("#mv-name");if(n){n.focus();n.select()}},50);return}
  if(selId&&S.items[selId]){
    const arr=ids(),i=arr.indexOf(selId);
    if(t.id==="mv-up"){if(i>0){placeAt(selId,i>1?{after:arr[i-2]}:"top");changed();scrollSel()}return}
    if(t.id==="mv-down"){if(i<arr.length-1){placeAt(selId,{after:arr[i+1]});changed();scrollSel()}return}
    if(t.id==="mv-top"||t.id==="mv-bot"){placeAt(selId,t.id==="mv-top"?"top":"end");moved();return}
    if(t.id==="mv-save"){saveSel();return}
    if(t.id==="mv-done"){selId=null;delArm=false;mvQ="";render();return}
    if(t.id==="mv-del"){if(!delArm){delArm=true;render();return}
      const it=I(selId);delete S.items[selId];
      if(!it.h)for(const did in S.dinners){const d=S.dinners[did];if((d.ing||[]).includes(selId)){d.ing=d.ing.filter(x=>x!==selId);if(d.qty&&d.qty[selId]!=null){const q=clone(d.qty);delete q[selId];d.qty=q}}}
      toast(it.n+" slettet");selId=null;delArm=false;changed();return}
  }
  if(t.id==="additem"){addItem();return}
  if(t.dataset.dayp){dayPick=t.dataset.dayp;dayQ="";renderPicker();setTimeout(()=>{const q=$("#dp-q");if(q)q.focus()},50);return}
  if(t.id==="newweek"){confirmReset=true;render();return}
  if(t.id==="noreset"){confirmReset=false;render();return}
  if(t.id==="yesreset"){const p=planned().p;for(const id of itemIds()){I(id).c=!p[id];if(I(id).x)I(id).x=0}confirmReset=false;changed();toast("Klar for ny uke");return}
  if(t.dataset.dii){const d=S.dinners[t.dataset.din];d.ing=d.ing.filter(x=>x!==t.dataset.dii);if(d.qty&&d.qty[t.dataset.dii]!=null){const q=clone(d.qty);delete q[t.dataset.dii];d.qty=q}changed();return}
  if(t.dataset.pick){pickerDin=t.dataset.pick;pickerQ="";renderPicker();return}
  if(t.dataset.deldin){const id=t.dataset.deldin;if(delArm!==id){delArm=id;render();return}
    const nm=S.dinners[id].name;delete S.dinners[id];for(const d of DAYS)if(S.week[d]===id)S.week[d]="";delArm=false;changed();toast(nm+" slettet");return}
  if(t.id==="adddin"){const v=$("#newdin").value.trim();if(!v)return;const id=newDinner(v);changed();pickerDin=id;pickerQ="";renderPicker()}
});
$("#view").addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="hide"){hideDone=t.checked;lsSet("hide2",hideDone);render();return}
  if(t.id==="mv-sec"&&t.value){placeAt(selId,{sec:t.value});moved();return}
  if(t.id==="newpos"){lastPos=t.value;lsSet("pos",lastPos)}
});
$("#view").addEventListener("toggle",e=>{if(e.target.classList&&e.target.classList.contains("basket"))lsSet("bopen",e.target.open)},true);
function saveSel(){
  const it=I(selId);if(!it)return;
  const v=$("#mv-name").value.trim();
  if(v&&v!==it.n){if(!it.h){const o=findByName(v);if(o&&o!==selId){toast(v+" finnes allerede i listen");return}}it.n=v}
  const ne=$("#mv-note");if(ne){const nv=ne.value.trim();if(nv)it.note=nv;else delete it.note}
  changed();toast("Lagret");
}
$("#view").addEventListener("keydown",e=>{if(e.key!=="Enter")return;const t=e.target;
  if(t.id==="mv-name"||t.id==="mv-note"){saveSel();return}
  if(t.id==="newitem")addItem();else if(t.id==="newdin")$("#adddin").click()});
$("#view").addEventListener("input",e=>{
  if(e.target.id==="newitem"){addQ=e.target.value;refreshAdd()}
  if(e.target.id==="mv-q"){mvQ=e.target.value;$("#mv-res").innerHTML=mvResHtml()}});
function addItem(){const v=addQ.trim();if(!v)return;
  const sq=splitQ(v),m=addMatches();
  if(!$("#newpos")){const ex=findByName(sq.n)||(m.length===1?m[0]:null);if(ex){if(I(ex).c)pickExisting(ex);else toast(I(ex).n+" står allerede på listen")}return}
  const pos=$("#newpos").value;lastPos=pos;lsSet("pos",pos);addQ="";
  const id=uid("i");S.items[id]={n:sq.n,c:false,q:sq.q,x:0,o:0};placeAt(id,parsePos(pos));toast(sq.n+" lagt til");
  changed();setTimeout(()=>{const i=$("#newitem");if(i)i.focus()},0)}

$("#picker").addEventListener("click",e=>{
  const t=e.target;
  if(dayPick){
    if(t.id==="dp-done"){closePicker();return}
    if(t.id==="dp-add"){const id=newDinner(dayQ.trim());setDay(id);dayPick=null;dayQ="";pickerDin=id;pickerQ="";renderPicker();return}
    const li=t.closest("li.item");if(!li)return;setDay(li.dataset.did);closePicker();return}
  const d=S.dinners[pickerDin];if(!d)return;
  if(t.id==="pk-done"){closePicker();return}
  if(t.id==="pk-add"){const sq=splitQ(pickerQ.trim());if(!sq.n)return;const pos=$("#pk-pos").value;lastPos=pos;lsSet("pos",pos);
    const id=uid("i");S.items[id]={n:sq.n,c:true,q:1,x:0,o:0};placeAt(id,parsePos(pos));d.ing=[...(d.ing||[]),id];if(sq.q>1)d.qty=Object.assign({},d.qty,{[id]:sq.q});
    afterIng(d);pickerQ="";$("#pk-q").value="";refreshPick();toast(sq.n+" lagt til");return}
  const qb=t.closest("button.qb");
  if(qb){const id=qb.dataset.dk,n=Math.max(1,dq(d,id)+ +qb.dataset.dq),q=Object.assign({},d.qty);if(n===1)delete q[id];else q[id]=n;d.qty=q;afterIng(d);refreshPick();return}
  const li=t.closest("li.item");if(!li||!li.dataset.pk)return;
  const id=li.dataset.pk,has=(d.ing||[]).includes(id);
  if(has){d.ing=d.ing.filter(x=>x!==id);if(d.qty&&d.qty[id]!=null){const q=clone(d.qty);delete q[id];d.qty=q}}else d.ing=[...(d.ing||[]),id];
  afterIng(d);refreshPick();
});
$("#picker").addEventListener("input",e=>{if(e.target.id==="dp-q"){dayQ=e.target.value;refreshPick();return}if(e.target.id==="pk-q"){pickerQ=e.target.value;refreshPick()}});
$("#picker").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pk-q"&&$("#pk-add"))$("#pk-add").click()});
function afterIng(d){if(DAYS.some(day=>S.dinners[S.week[day]]===d))applyWeek();changed(true)}

/* ---- Firebase: innlogging og synk ---- */
const gate=$("#gate");
function showGate(msg,btn){gate.hidden=false;$("#gate-msg").textContent=msg;$("#login").hidden=!btn}
let unsub=null;
function adopt(d){
  S=d;S.items=S.items||{};S.dinners=S.dinners||{};S.week=S.week||{};B=clone(S);
  trip=trip.filter(id=>S.items[id]);
  render();if(dayPick||pickerDin)refreshPick();
}
function startSync(user){
  ref=fdb.collection("lists").doc("main");
  status("Kobler til…");
  unsub=ref.onSnapshot({includeMetadataChanges:true},snap=>{
    gate.hidden=true;
    if(!snap.exists){if(!snap.metadata.fromCache){B=clone(S);ref.set(clone(S)).then(()=>status("Listen er opprettet"))}return}
    const d=snap.data();
    if(!d.v||d.v<3){if(snap.metadata.fromCache)return;const n=toV3(d);fdb.collection("lists").doc("backup-v2").set(clone(d)).catch(()=>{});adopt(n);ref.set(clone(n)).then(()=>toast("Listen er oppgradert"));return}
    if(saveTimer)return;
    adopt(d);
    status(snap.metadata.fromCache?"Frakoblet, endringer lagres når du er på nett igjen":"Synkronisert · "+(user.email||""));
  },err=>{
    if(err&&err.code==="permission-denied")showGate("Kontoen "+(user.email||"")+" har ikke tilgang til denne listen. Be eieren legge deg til.",true);
    else status("Mistet synk, last appen på nytt");
  });
}
render();
let fdb=null;
if(typeof firebaseConfig==="undefined"||!firebaseConfig.apiKey||/LIM_INN/.test(firebaseConfig.apiKey)){
  showGate("Appen mangler Firebase-oppsett. Lim inn firebaseConfig i config.js.",false);
}else{
  firebase.initializeApp(firebaseConfig);
  fdb=firebase.firestore();
  fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  const auth=firebase.auth();
  auth.getRedirectResult().catch(()=>{});
  auth.onAuthStateChanged(u=>{
    if(unsub){unsub();unsub=null}
    if(u){startSync(u)}else{ref=null;showGate("Logg inn for å se og synkronisere handlelisten.",true)}
  });
  $("#login").addEventListener("click",async()=>{
    const p=new firebase.auth.GoogleAuthProvider();
    try{await auth.signInWithPopup(p)}
    catch(e){
      if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"))auth.signInWithRedirect(p);
      else if(e&&e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request")showGate("Innlogging feilet: "+(e.code||e.message),true);
    }
  });
  $("#logout").addEventListener("click",()=>auth.signOut());
}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>
