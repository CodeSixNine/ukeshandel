<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Ukeshandel</title>
<meta name="theme-color" content="#2f7a4c">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one narrow column like a phone note; sticky tab bar; dinner section on top, rest below */
:root{
  --bg:#f6f7f3; --card:#ffffff; --ink:#1d2621; --muted:#66716a; --line:#e2e6df;
  --accent:#2f7a4c; --accent-soft:#e3f0e7; --done:#a3aba5; --warn:#a15c00; --bad:#b3261e;
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131815; --card:#1b221e; --ink:#e7ece8; --muted:#97a39b; --line:#2b352f;
  --accent:#6cc28f; --accent-soft:#1f3328; --done:#5d6861; --warn:#f0b35a; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131815; --card:#1b221e; --ink:#e7ece8; --muted:#97a39b; --line:#2b352f;
  --accent:#6cc28f; --accent-soft:#1f3328; --done:#5d6861; --warn:#f0b35a; --bad:#ff8a80; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 80px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.9rem;margin:6px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.95rem;margin:0 0 12px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding-block:8px;border-bottom:1px solid var(--line)}
nav button{flex:1;min-width:0;font:700 .85rem var(--f-body);padding:10px 2px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:22px 0 8px;text-wrap:balance}
.group{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ghead b{color:var(--accent);font-size:.95rem;letter-spacing:0;text-transform:none;font-family:var(--f-display)}
.groups{display:flex;flex-direction:column;gap:10px}
ul{list-style:none;margin:0;padding:0}
li.item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.ghead+ul li.item:first-child{border-top:0}
li.item input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
li.item span{min-width:0;overflow-wrap:anywhere}
li.item.on span{color:var(--done);text-decoration:line-through}
.rest li.item:first-child{border-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{font:700 .95rem var(--f-body);padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn.small{padding:6px 10px;font-size:.85rem}
.btn:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],input[type=search],select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0;flex:1}
label.tog{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.95rem}
.day{display:grid;grid-template-columns:5.5em 1fr auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day b{font-family:var(--f-display);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:4px 6px 4px 12px;font-size:.92rem}
.chip button{border:0;background:transparent;color:var(--muted);font-size:1.1rem;line-height:1;cursor:pointer;padding:2px 6px}
.dish .ghead{align-items:center}
.addline{display:flex;gap:8px;padding:0 14px 14px}
.empty{color:var(--muted);padding:12px 14px}
.status{color:var(--muted);font-size:.8rem;margin-top:24px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.95rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:min(92vw,520px);width:max-content}
.toast.act{pointer-events:auto}
.toast button{background:none;border:0;color:var(--accent-soft);font:700 .95rem var(--f-body);text-decoration:underline;cursor:pointer;padding:4px 0;flex:none}
.toast.show{opacity:1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:.95rem}
li.item.edit{gap:10px}
li.item.edit .grip{color:var(--muted);font-size:.9rem;letter-spacing:-2px;flex:none}
li.item.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:10px;padding-top:12px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel .ptitle{font-family:var(--f-display);font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
.panel select{flex:1 1 160px}
.panel input[type=search]{flex:1 1 160px;min-width:0;font-size:16px}
.mvlist{max-height:32vh}
.addbox{display:flex;flex-direction:column;gap:8px}
.addbox select{flex:none;width:100%}
.addbox input[type=search]{flex:none}
.reslist{background:var(--card);border:1px solid var(--line);border-radius:12px;max-height:50vh;overflow-y:auto}
li.res{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
li.res:first-child{border-top:0}
li.res span{min-width:0;overflow-wrap:anywhere}
li.res .state{margin-left:auto;flex:none;color:var(--accent);font-weight:700;font-size:.85rem}
li.res.active{background:var(--accent-soft)}
li.res.active .state{color:var(--muted);font-weight:400}
.picker{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.picker[hidden]{display:none!important}
.daybtn{text-align:left;width:100%;font-weight:400}
.daybtn.none{color:var(--muted)}
.cnt{margin-left:auto;color:var(--muted);font-size:.8rem;flex:none}
.panel input[type=text]{flex:1 1 160px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.phead input{flex:1;min-width:0;padding:8px 12px;font-size:16px}
.pkbody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:12px;-webkit-overflow-scrolling:touch}
.pklist{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pklist:empty{display:none}
input[type=search]{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.pklist li.item:first-child{border-top:0}
li.item.picked{background:var(--accent-soft)}
.pknew{background:var(--card);border:1px dashed var(--accent);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pknew select{flex:1 1 160px}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.gate[hidden]{display:none!important}
.gate img{width:96px;height:96px;border-radius:22px}
.gate h1{margin:0}
.gate p{max-width:32ch;color:var(--muted);margin:0}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:.8rem;cursor:pointer;padding:4px}
li.item .nm{flex:1;display:flex;flex-direction:column}
li.item .by{color:var(--muted);font-size:.78rem}
.step{display:flex;align-items:center;gap:4px;flex:none;margin-left:auto}
.qb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 1.1rem var(--f-body);cursor:pointer;line-height:1;padding:0}
.qb:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.qv{min-width:1.6em;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:400}
.qv.many{color:var(--accent);font-weight:700}
.cq{color:var(--accent);font-weight:700}
li.item .note{color:var(--accent);font-size:.8rem}
li.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 6px;border-top:1px solid var(--line);background:var(--bg)}
.rest li.sec:first-child{border-top:0}
.secbtn{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;color:var(--ink);font:600 1rem var(--f-display);cursor:pointer;text-align:left}
.secbtn .chev{color:var(--muted);width:1em;display:inline-block}
li.sec small{color:var(--muted);font-size:.8rem;flex:none}
li.sec small.left{color:var(--accent);font-weight:700}
li.item.hdr{background:var(--bg)}
.pkh{padding:12px 14px 4px;font:600 .85rem var(--f-display);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-top:1px solid var(--line)}
.pklist .pkh:first-child{border-top:0}
.shopbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--navh,62px));z-index:4;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);padding-block:12px;color:var(--muted)}
.shopbar .big{font-family:var(--f-display);font-size:1.6rem;color:var(--ink)}
.shsec{font:600 .85rem var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 6px}
ul.shop{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li.sh{display:flex;align-items:center;gap:14px;padding:15px 16px;border-top:1px solid var(--line);cursor:pointer;user-select:none;font-size:1.12rem}
li.sh:first-child{border-top:0}
li.sh .box{width:26px;height:26px;border-radius:7px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:.9rem;color:var(--bg)}
li.sh .box.on{background:var(--accent);border-color:var(--accent)}
li.sh .nm{flex:1;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
li.sh .shq{color:var(--accent);font-family:var(--f-display);font-size:1.2rem;flex:none}
li.sh.done .nm{color:var(--done);text-decoration:line-through}
.basket{margin-top:20px}
.basket summary{cursor:pointer;color:var(--muted);font-weight:700;padding:8px 0}
body.editing .wrap{padding-bottom:440px}
.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--navh,62px));z-index:4;background:var(--bg);display:flex;flex-direction:column;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.stick .toolbar{margin-top:10px}
.today{margin:-6px 0 10px;color:var(--muted);font-size:.95rem}
.today b{color:var(--ink)}
.today .wk{font-variant-numeric:tabular-nums}
.linkbtn.tl{font-size:.95rem;color:var(--accent);text-decoration:none;font-weight:700;padding:0}
.rlink{color:var(--accent);font-weight:700;text-decoration:none}
.rlink:hover,.linkbtn.tl:hover{text-decoration:underline}
.day.istoday{background:var(--accent-soft)}
.day b{display:flex;flex-direction:column}
.rmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:0 14px 10px}
.pchip{background:var(--accent-soft);border-radius:999px;padding:2px 10px;font-size:.85rem}
.rnote{flex-basis:100%;color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.addline{flex-wrap:wrap}
.ptl{font-family:var(--f-display);font-size:1.2rem;flex:1;min-width:0;overflow-wrap:anywhere}
.fl{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.9rem;color:var(--muted)}
.fl input,.fl textarea{font:400 16px/1.45 var(--f-body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.fl textarea{resize:vertical;min-height:220px}
.hlist{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li.hrow{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 14px;border-top:1px solid var(--line)}
li.hrow:first-child{border-top:0}
li.hrow .nm{flex:1;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.hdate{font:400 .85rem var(--f-body);padding:6px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:8.6em;flex:none}
small.exp{font-size:.8rem;font-weight:700}
small.exp.ok{color:var(--muted);font-weight:400}
small.exp.warn{color:var(--warn)}
small.exp.bad{color:var(--bad)}
.cnt2{font:400 .9rem var(--f-body);color:var(--muted)}
.sug{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-top:1px solid var(--line)}
.sug:first-child{border-top:0}
.sug small{color:var(--muted)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{margin:6px 0 2px}
nav button{position:relative}
.dot{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font:700 .72rem/20px var(--f-body);text-align:center}
.srow{display:flex;gap:8px;align-items:stretch}
.srow input{flex:1;min-width:0}
.srow .btn{flex:none}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:.92rem}
.banner span{min-width:0}
.who{display:inline-grid;place-items:center;width:20px;height:20px;margin-left:8px;border-radius:999px;background:var(--accent);color:var(--bg);font:700 .7rem var(--f-body);vertical-align:2px;text-decoration:none}
.nmt{display:block}
.mlist{list-style:none;margin:6px 0;padding:0;display:flex;flex-direction:column;gap:2px}
.mlist li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.mlist li:first-child{border-top:0}
.mlist li>span:first-child{min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.mlist small{color:var(--muted)}
.nowrap{flex-wrap:nowrap;flex:none}
.dayx{grid-column:2 / -1;margin-top:-4px}
.pers{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.pers .qb{width:30px;height:30px;font-size:1rem}
.pers .chg{color:var(--accent);font-weight:700}
.pers-hint{font-size:.8rem;padding:0;text-align:left}
.shopopts{margin:-4px 0 6px;justify-content:space-between}
.shopopts select{flex:1 1 160px;max-width:260px;padding:6px 10px;font-size:.9rem}
.usedq{display:flex;gap:6px;align-items:center;flex:none}
.row.two{flex-wrap:nowrap}
.mini{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);flex:1;min-width:0}
.panel .mini input{flex:none;width:100%;font:inherit;font-size:16px;color:var(--ink);padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.panel{max-height:82vh;overflow-y:auto}
.panel label.tog{font-size:.9rem}
.msec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.msec h3{font:600 1.05rem var(--f-display);margin:0 0 6px}
.msec .sub{margin:0 0 8px}
.msec .row input{flex:1 1 180px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:4.2em 1fr auto;gap:8px;align-items:center;font-size:.85rem;font-variant-numeric:tabular-nums}
.bl{color:var(--muted)}
.bt{height:10px;border-radius:5px;background:var(--accent-soft);overflow:hidden}
.bt span{display:block;height:100%;background:var(--accent);border-radius:5px}
.bv{min-width:5.5em;text-align:right}
.stack{display:flex;flex-direction:column;gap:8px}
.sharetxt{width:100%;min-height:50vh;font:400 15px/1.5 var(--f-body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.fl select{font:400 16px var(--f-body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.qb:disabled{opacity:.35;cursor:default}
.srow .btn{padding-inline:12px}
li.rcl{gap:10px;cursor:default}
li.rcl.off .rcname{opacity:.45}
.rcname{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:none;border:0;padding:2px 0;color:var(--ink);font:inherit;cursor:pointer;overflow-wrap:anywhere}
.rcname span{text-decoration:underline dotted var(--muted);text-underline-offset:3px}
li.item input.rcp{width:5.6em;height:auto;accent-color:auto;flex:none;text-align:right;font:inherit;font-size:16px;font-variant-numeric:tabular-nums;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.warnt{color:var(--warn);font-weight:700}
.rcd{width:100%}
.rcd summary{display:flex;justify-content:space-between;gap:10px;cursor:pointer;list-style:none}
.rcd summary::-webkit-details-marker{display:none}
.rcd .mlist{margin-left:8px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="gate" id="gate"><img src="icon-192.png" alt=""><h1>Ukeshandel</h1><p id="gate-msg">Laster…</p><button class="btn primary" id="login" hidden>Logg inn med Google</button></div>
<div class="wrap">
  <header class="top"><h1>Ukeshandel</h1><button class="btn small" id="more" aria-label="Mer: del, butikker, budsjett, matsvinn og sikkerhetskopier">Mer</button></header>
  <p class="sub" id="sub"></p>
  <p class="today" id="today"></p>
  <nav role="tablist">
    <button role="tab" id="tab-liste" data-tab="liste" aria-selected="true">Handleliste</button>
    <button role="tab" id="tab-uke" data-tab="uke" aria-selected="false">Ukeplan</button>
    <button role="tab" id="tab-middager" data-tab="middager" aria-selected="false">Middager</button>
    <button role="tab" id="tab-hjemme" data-tab="hjemme" aria-selected="false">Hjemme<span class="dot" id="homedot" hidden></span></button>
  </nav>
  <section id="view"></section>
  <p class="status"><span id="status"></span> <button class="linkbtn" id="logout">Logg ut</button></p>
</div>
<div class="picker" id="picker" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="scanfile" accept="image/*" capture="environment" hidden>
<input type="file" id="rcptfile" accept="image/*" hidden>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
