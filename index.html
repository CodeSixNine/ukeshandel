<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Ukeshandel</title>
<meta name="theme-color" content="#2f7a4c">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>\n*{{box-sizing:border-box}}\nhtml,body{{margin:0}}\n[hidden]{{display:none!important}}\n:root{{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}}
/* Layout: one narrow column like a phone note; sticky tab bar; dinner section on top, rest below */
:root{
  --bg:#f6f7f3; --card:#ffffff; --ink:#1d2621; --muted:#66716a; --line:#e2e6df;
  --accent:#2f7a4c; --accent-soft:#e3f0e7; --done:#a3aba5;
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131815; --card:#1b221e; --ink:#e7ece8; --muted:#97a39b; --line:#2b352f;
  --accent:#6cc28f; --accent-soft:#1f3328; --done:#5d6861; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131815; --card:#1b221e; --ink:#e7ece8; --muted:#97a39b; --line:#2b352f;
  --accent:#6cc28f; --accent-soft:#1f3328; --done:#5d6861; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 80px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.9rem;margin:6px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.95rem;margin:0 0 12px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding-block:8px;border-bottom:1px solid var(--line)}
nav button{flex:1;font:700 .95rem var(--f-body);padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:22px 0 8px;text-wrap:balance}
.group{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ghead b{color:var(--accent);font-size:.95rem;letter-spacing:0;text-transform:none;font-family:var(--f-display)}
.groups{display:flex;flex-direction:column;gap:10px}
ul{list-style:none;margin:0;padding:0}
li.item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.ghead+ul li.item:first-child{border-top:0}
li.item input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
li.item span{min-width:0;overflow-wrap:anywhere}
li.item.on span{color:var(--done);text-decoration:line-through}
.rest li.item:first-child{border-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{font:700 .95rem var(--f-body);padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn.small{padding:6px 10px;font-size:.85rem}
.btn:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],input[type=search],select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0;flex:1}
label.tog{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.95rem}
.day{display:grid;grid-template-columns:5.5em 1fr;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day b{font-family:var(--f-display);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:4px 6px 4px 12px;font-size:.92rem}
.chip button{border:0;background:transparent;color:var(--muted);font-size:1.1rem;line-height:1;cursor:pointer;padding:2px 6px}
.dish .ghead{align-items:center}
.addline{display:flex;gap:8px;padding:0 14px 14px}
.empty{color:var(--muted);padding:12px 14px}
.status{color:var(--muted);font-size:.8rem;margin-top:24px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.95rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:.95rem}
li.item.edit{gap:10px}
li.item.edit .grip{color:var(--muted);font-size:.9rem;letter-spacing:-2px;flex:none}
li.item.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
body.editing .wrap{padding-bottom:220px}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:10px;padding-top:12px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel .ptitle{font-family:var(--f-display);font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
.panel select{flex:1 1 160px}
.panel input[type=search]{flex:1 1 160px;min-width:0;font-size:16px}
.mvlist{max-height:32vh}
.addbox{display:flex;flex-direction:column;gap:8px}
.addbox select{flex:none;width:100%}
.addbox input[type=search]{flex:none}
.reslist{background:var(--card);border:1px solid var(--line);border-radius:12px;max-height:50vh;overflow-y:auto}
li.res{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
li.res:first-child{border-top:0}
li.res span{min-width:0;overflow-wrap:anywhere}
li.res .state{margin-left:auto;flex:none;color:var(--accent);font-weight:700;font-size:.85rem}
li.res.active{background:var(--accent-soft)}
li.res.active .state{color:var(--muted);font-weight:400}
.picker{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.picker[hidden]{display:none!important}
.daybtn{text-align:left;width:100%;font-weight:400}
.daybtn.none{color:var(--muted)}
.cnt{margin-left:auto;color:var(--muted);font-size:.8rem;flex:none}
.panel input[type=text]{flex:1 1 160px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.phead input{flex:1;min-width:0;padding:8px 12px;font-size:16px}
.pkbody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:12px;-webkit-overflow-scrolling:touch}
.pklist{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pklist:empty{display:none}
input[type=search]{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.pklist li.item:first-child{border-top:0}
li.item.picked{background:var(--accent-soft)}
.pknew{background:var(--card);border:1px dashed var(--accent);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pknew select{flex:1 1 160px}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.gate[hidden]{display:none!important}
.gate img{width:96px;height:96px;border-radius:22px}
.gate h1{margin:0}
.gate p{max-width:32ch;color:var(--muted);margin:0}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:.8rem;cursor:pointer;padding:4px}
li.item .nm{flex:1;display:flex;flex-direction:column}
li.item .by{color:var(--muted);font-size:.78rem}
.step{display:flex;align-items:center;gap:4px;flex:none;margin-left:auto}
.qb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 1.1rem var(--f-body);cursor:pointer;line-height:1;padding:0}
.qb:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.qv{min-width:1.6em;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:400}
.qv.many{color:var(--accent);font-weight:700}
.cq{color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="gate" id="gate"><img src="icon-192.png" alt=""><h1>Ukeshandel</h1><p id="gate-msg">Laster…</p><button class="btn primary" id="login" hidden>Logg inn med Google</button></div>
<div class="wrap">

  </nav>
  <section id="view"></section>

function key(s){return String(s).trim().toLowerCase()}
function dq(din,k){return (din.qty&&din.qty[k])||1}
function plannedMap(st){const p={},by={};for(const d of DAYS){const din=st.dinners.find(x=>x.id===st.week[d]);if(din)for(const i of din.ing){const k=key(i);p[k]=(p[k]||0)+dq(din,k);(by[k]=by[k]||[]).push(din.name)}}return {p,by}}
function applyWeek(st){
  const {p}=plannedMap(st);
  for(const din of st.dinners)for(const i of din.ing){if(p[key(i)]&&!st.items.some(it=>key(it.n)===key(i)))st.items.push({n:i,c:false,q:1})}

  return Object.keys(p).length;

  for(const it of st.items){const s=splitQ(it.n),k=key(s.n);
    if(k in idx){const o=out[idx[k]];o.q=Math.max(o.q,s.q);o.c=o.c&&it.c}
    else{idx[k]=out.length;out.push({n:s.n,c:!!it.c,q:s.q})}}
  st.items=out;
  for(const d of st.dinners){const seen=new Set(),ing=[];for(const i of d.ing){const s=splitQ(i),k=key(s.n);if(!seen.has(k)){seen.add(k);ing.push(s.n)}}d.ing=ing;d.qty={}}
  st.v=2;return true;
}
function itemQty(it){const k=key(it.n);return PL.p[k]?Math.max(1,PL.p[k]+(it.x||0)):(it.q||1)}
function bumpQty(it,delta){const k=key(it.n),pp=plannedMap(S).p[k];
  if(pp){const nx=(it.x||0)+delta;if(pp+nx<1)return;it.x=nx}
  else{const nq=(it.q||1)+delta;if(nq<1)return;it.q=nq}
  changed()}

/* ---- placering i listen ---- */
function posOptions(exclude){
  let o=`<option value="end">Nederst</option><option value="top">Øverst</option>`;

  return o;
}
function placeAt(obj,pos){
  const i=S.items.indexOf(obj);if(i>=0)S.items.splice(i,1);
  if(pos==="top")S.items.unshift(obj);
  else if(pos&&pos.startsWith("k:")){const t=S.items.findIndex(it=>key(it.n)===pos.slice(2));if(t>=0)S.items.splice(t+1,0,obj);else S.items.push(obj)}

}

    gate.hidden=true;
    if(!snap.exists){ref.set(JSON.parse(JSON.stringify(S))).then(()=>status("Listen er opprettet"));return}
    if(snap.metadata.hasPendingWrites||dirty||saving)return;
    const d=snap.data();if(d&&Array.isArray(d.items)){
      const selK=selItem&&key(selItem.n);
      S=JSON.parse(JSON.stringify(d));if(migrate(S)){changed(true)}try{localStorage.setItem("state",JSON.stringify(S))}catch(e){}
      if(selK)selItem=findItem(selK)||null;
      if(pickerDin||dayPick){pickerDin?refreshPick():null}else render();
    }
    status(snap.metadata.fromCache?"Frakoblet, endringer lagres når du er på nett igjen":"Synkronisert · "+(user.email||""));
  },err=>{
    if(err&&err.code==="permission-denied")showGate("Kontoen "+(user.email||"")+" har ikke tilgang til denne listen. Be eieren legge deg til.",true);
    else status("Mistet synk, last appen på nytt");
  });
}
render();
let fdb=null;
if(typeof firebaseConfig==="undefined"||!firebaseConfig.apiKey||/LIM_INN/.test(firebaseConfig.apiKey)){
  showGate("Appen mangler Firebase-oppsett. Lim inn firebaseConfig i config.js.",false);
}else{
  firebase.initializeApp(firebaseConfig);
  fdb=firebase.firestore();
  fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  const auth=firebase.auth();
  auth.getRedirectResult().catch(()=>{});
  auth.onAuthStateChanged(u=>{
    if(unsub){unsub();unsub=null}
    if(u){startSync(u)}else{ref=null;showGate("Logg inn for å se og synkronisere handlelisten.",true)}
  });
  $("#login").addEventListener("click",async()=>{
    const p=new firebase.auth.GoogleAuthProvider();
    try{await auth.signInWithPopup(p)}
    catch(e){
      if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"))auth.signInWithRedirect(p);
      else if(e&&e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request")showGate("Innlogging feilet: "+(e.code||e.message),true);
    }
  });
  $("#logout").addEventListener("click",()=>auth.signOut());
}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>
</body>
